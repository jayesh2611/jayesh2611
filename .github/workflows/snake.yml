import pygame
import sys

# Initialize Pygame
pygame.init()

# Screen settings
WIDTH, HEIGHT = 600, 400
CELL_SIZE = 20
screen = pygame.display.set_mode((WIDTH, HEIGHT))
pygame.display.set_caption("Snake Game")

# Colors
WHITE = (255, 255, 255)
GREEN = (0, 200, 0)
RED = (200, 0, 0)
BLACK = (0, 0, 0)

# Load GIF for end screen (Pygame only supports the first frame of GIFs)
snake_gif = pygame.image.load("snake.gif")

# Snake and Food
snake = [(100, 100), (120, 100), (140, 100)]
direction = 'RIGHT'
food = (300, 200)
clock = pygame.time.Clock()

def move_snake(snake, direction):
    x, y = snake[-1]
    if direction == 'UP':
        y -= CELL_SIZE
    elif direction == 'DOWN':
        y += CELL_SIZE
    elif direction == 'LEFT':
        x -= CELL_SIZE
    elif direction == 'RIGHT':
        x += CELL_SIZE
    new_head = (x, y)
    return new_head

def game_over_screen():
    screen.fill(WHITE)
    font = pygame.font.SysFont(None, 48)
    text = font.render('Game Over!', True, RED)
    screen.blit(text, (WIDTH//2 - text.get_width()//2, HEIGHT//3))
    # Draw the GIF
    gif_rect = snake_gif.get_rect(center=(WIDTH//2, HEIGHT//2 + 60))
    screen.blit(snake_gif, gif_rect)
    pygame.display.flip()
    pygame.time.wait(3000)

def main():
    global direction, snake, food
    running = True
    while running:
        screen.fill(BLACK)
        for event in pygame.event.get():
            if event.type == pygame.QUIT:
                running = False
            elif event.type == pygame.KEYDOWN:
                if event.key == pygame.K_UP and direction != 'DOWN':
                    direction = 'UP'
                elif event.key == pygame.K_DOWN and direction != 'UP':
                    direction = 'DOWN'
                elif event.key == pygame.K_LEFT and direction != 'RIGHT':
                    direction = 'LEFT'
                elif event.key == pygame.K_RIGHT and direction != 'LEFT':
                    direction = 'RIGHT'

        new_head = move_snake(snake, direction)
        # Check collisions
        if (new_head in snake) or not (0 <= new_head[0] < WIDTH and 0 <= new_head[1] < HEIGHT):
            game_over_screen()
            running = False
            continue

        snake.append(new_head)
        if new_head == food:
            # Generate new food
            import random
            while True:
                food = (random.randrange(0, WIDTH, CELL_SIZE), random.randrange(0, HEIGHT, CELL_SIZE))
                if food not in snake:
                    break
        else:
            snake.pop(0)

        # Draw food
        pygame.draw.rect(screen, RED, (*food, CELL_SIZE, CELL_SIZE))
        # Draw snake
        for pos in snake:
            pygame.draw.rect(screen, GREEN, (*pos, CELL_SIZE, CELL_SIZE))

        pygame.display.flip()
        clock.tick(10)

    pygame.quit()
    sys.exit()

if __name__ == "__main__":
    main()

